<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step CDs - Home page</title>
    <link rel="icon" type="image/x-icon" href="site-other-images/dan-sleeping.jpg">
    <style>

        :root {
            --bg-color-page: #0081AF;
            --bg-page-text-color: #eaba6b;
            --popup-text-color: #0081AF;
            --popup-bg-color: #EAD2AC;
            --scrollbar-color: #266B84;
            --scrollbar-thumb-color: #eaba6b;
            --player-color: #AA4586;
        }

        /* Phone screens */ 
        @media screen and (min-width: 300px) {
            #FMLDiv { top: 750px; left: 30px;}
            #RexOSGDiv { top: 40px; left: 10px;}
            #ShortFindDiv { top: 320px; left: 120px;}
            #EFS9Div      { top: 540px; left: 50px;}
            #danSDiv {top: 1000px; left: 40px;}

            #projects-collection {
                width: 300px;
                height: 100%;
            }

            #projects-collection img {
                display: block;
                height: auto;
                width: 200px;
            }
        }

        /*Tablet screens */
        @media screen and (min-width: 800px) {
            #FMLDiv { top: 550px; left: 55px;}
            #RexOSGDiv { top: 40px; left: 35px;}
            #ShortFindDiv { top: 120px; left: 575px; } 
            #EFS9Div      { top: 340px; left: 245px; }
            #danSDiv {top: 500px; left: 525px;}

            #projects-collection {
                width: 800px;
                height: 100%;
            }

            #projects-collection img {
                display: block;
                height: auto;
                width: 250px;
            }
        }

        /*Computer screens */
        @media screen and (min-width: 1600px) {
            #FMLDiv { top: 550px; left: 30px;}
            #RexOSGDiv { top: 40px; left: 10px;}
            #ShortFindDiv { top: 120px; left: 420px; }
            #EFS9Div      { top: 340px; left: 220px; }
            #danSDiv {top: 500px; left: 500px;}

            #projects-collection {
                width: 800px;
                height: 100%;
            }

            #projects-collection img {
                display: block;
                height: auto;
                width: 200px;
            }
        } 

        body {
            background-color: var(--bg-color-page);
            color: var(--bg-page-text-color);
        }

        @font-face {
            font-family: normfont;
            src: url("fonts/ns-audex/Audex-Regular.ttf");
        }

        @font-face {
            font-family: titlefont;
            src: url("fonts/normfont-neuropol/Neuropol.otf");
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: titlefont;
        }

        p, li, span {
            font-family: normfont;
            font-size: medium;
        }

        #index-page {
            position: relative;
        }

        #background-text {
            text-align: center;
        }

        #projects-collection {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
        }

        #projects-collection > div {
            position: absolute;
        }

        #projects-collection > div:hover {
            border-color: #00ABE7; border-width: 10px; border-style:dashed;
        }

        /* --- Pop-up --- */
        #pop-up {
            width: min(800px, 90vw);
            max-height: 85vh;
            overflow-y: auto;
            border: none;
            border-radius: 12px;
            padding: 2rem;
            background-color: var(--popup-bg-color);
            color: var(--popup-text-color);
        }
        #pop-up::backdrop { background: rgb(0 0 0 / 0.6); }
        #pop-up img { max-width: 100%; height: auto; }

        #pop-up-close {
            color: var(--bg-color-page);
        }

        /* --- Images and videos in a project description --- */
        #content .media-tile {
            display: block;
            position: relative;
            max-width: 100%;
            padding: 0;
            border: none;
            background: none;
            cursor: zoom-in;
        }

        #content .media-tile > * { display: block; max-width: 100%; height: auto; }

        #content .media-tile:hover,
        #content .media-tile:focus-visible {
            outline: 3px dashed #00ABE7;
            outline-offset: 2px;
        }

        /* Two or more in a row (same paragraph in the .md) become a grid */
        #content .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        #content .media-grid .media-tile { width: 100%; aspect-ratio: 4 / 3; }
        #content .media-grid .media-tile > * { width: 100%; height: 100%; object-fit: cover; }

        #content .media-tile.is-video::after {
            content: "▶";
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            font-size: 2rem;
            color: white;
            background: rgb(0 0 0 / 0.3);
        }

        /* --- Zoomed-in view --- */
        #lightbox {
            position: fixed;
            inset: 0;
            box-sizing: border-box;
            width: 100vw;
            height: 100dvh;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 1rem;
            border: none;
            background: rgb(0 0 0 / 0.9);
            color: white;
        }

        #lightbox:popover-open {
            display: grid;
            grid-template-columns: auto 1fr auto;
            grid-template-rows: 1fr auto;
            align-items: center;
            gap: 0.5rem;
        }

        #lightbox-stage {
            min-width: 0;
            height: 100%;
            display: grid;
            place-items: center;
            cursor: zoom-out;
        }

        #lightbox-stage img,
        #lightbox-stage video {
            max-width: 100%;
            max-height: calc(100dvh - 6rem);
            object-fit: contain;
            cursor: default;
        }

        #lightbox-caption {
            grid-column: 1 / -1;
            margin: 0;
            min-height: 1.5em;
            text-align: center;
        }

        #lightbox button {
            width: 2.5rem;
            height: 2.5rem;
            border: none;
            border-radius: 99px;
            font-size: 1.25rem;
            color: var(--player-color);
            cursor: pointer;
        }

        #lightbox-close { position: absolute; top: 1rem; right: 1rem; z-index: 1; }

        /* --- Music player --- */
        #player {
            position: sticky;
            bottom: 0;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin: 1rem auto 0;
            padding: 0.5rem 1rem;
            width: min(22rem, 100%);
            min-height: 3rem;
            border-radius: 99px;
            background: var(--player-color);
            color:white;
        }

        #player[hidden] { display: none; }

        #player p { margin: 0; }

        #player-control-buttons {
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
        }

        #player button {
          color: var(--player-color);
          white-space: nowrap;
        }

        ::-webkit-scrollbar {
            background-color: var(--scrollbar-color);
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar-thumb-color);
        }

        .tooltip {
            position: relative;
            display: inline-block;
            border-bottom: 1px dotted black;
            cursor: pointer;
        }

        .tooltiptext {
            visibility: hidden;
            width: 130px;
            background-color: black;
            color: white;
            text-align: center;
            padding: 5px 0;
            border-radius: 6px;
            position: absolute;
            z-index: 1;
        }

        .tooltip:hover .tooltiptext {
            visibility: visible;
        }
        
        span::after {
            content: attr(data-genres);
        }

    </style>
</head>
<body>

        <div id="background-text">

            <p>Step CDs</p>
            <p>Step CDs</p>
            <p>Step CDs</p>
            <p>Step CDs</p>
        </div>
        <div id="projects-collection">
            <div id="RexOSGDiv" class="tooltip"><a href="#" data-file="projects/rexosg/rexosg.md" data-music="projects/rexosg/music/superhero.mp3"><img src="./projects/rexosg/img/rexosg-album-art.png" alt="RexOSG"><span class="tooltiptext" data-genres="Full-stack engineering, User testing">Genres: </span></a></div>
            <div id="ShortFindDiv" class="tooltip"><a href="#" data-file="projects/shortfind/shortfind.md" data-music="projects/shortfind/music/european-redwood-v3.mp3"><img src="./projects/shortfind/img/shortfind-album-art.png" alt="ShortFind"><span class="tooltiptext" data-genres="UI/UX design, UI prototyping">Genres: </span></a></div>

        <div id="pop-up" popover>

                <p>Check out track 1!</p>

            </div>
            <!-- Nested inside #pop-up so opening it doesn't close the pop-up -->
            <div id="lightbox" popover>
                <button id="lightbox-close" popovertarget="lightbox" popovertargetaction="hide" aria-label="Close">✕</button>
                <button id="lightbox-prev" aria-label="Previous">‹</button>
                <div id="lightbox-stage"></div>
                <button id="lightbox-next" aria-label="Next">›</button>

            </div>
