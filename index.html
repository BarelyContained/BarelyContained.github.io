<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step CDs - Home page</title>
    <style>

        @font-face {
            font-family: normfont;
            src: url("fonts/titlefont-neuropol_x/Neuropol-X-Rg.otf");
        }

        @font-face {
            font-family: titlefont;
            src: url("fonts/normfont-neuropol/Neuropol.otf");
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: titlefont;
        }

        p {
            font-family: normfont;
            font-size: medium;
        }

        #index-page {
            position: relative;
        }

        #background-text {
            text-align: center;
        }

        #projects-collection {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 600px;
            z-index: 1;
        }

        #projects-collection > div {
            position: absolute;
        }

        #FMLDiv { top: 550px; left: 30 px;}
        #RexOSGDiv { top: 40px; left: 10px;}
        #ShortFindDiv { top: 120px; left: 420px; }
        #EFS9Div      { top: 340px; left: 220px; }

        #projects-collection img {
            display: block;
            width: 200px;
            height: auto;
        }

        /* --- Pop-up --- */
        #pop-up {
            width: min(800px, 90vw);
            max-height: 85vh;
            overflow-y: auto;
            border: none;
            border-radius: 12px;
            padding: 2rem 2rem 5rem;
        }
        #pop-up::backdrop { background: rgb(0 0 0 / 0.6); }
        #pop-up img { max-width: 100%; height: auto; }

        /* --- Music player --- */
        #player {
            position: fixed;
            bottom: 1rem;
            left: 50%;
            translate: -50% 0;
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            background: #111;
            color: #fff;
        }
        #player[hidden] { display: none; }

    </style>
</head>
